media_paths:
  linux: "/mnt/storage"

# The restic-termux-backup commit the phone runs
# (run_onchange_after_install-termux-backup.sh). To update the phone: push to
# that repo, put the new commit here, then `chezmoi update` on the phone.
termux_backup:
  commit: "d18aa628e2ae6cef1f4c6a84bf66e5b58d4ddc40"

# Limits for the Android bws updater (run_after_update-bws.sh): it ignores
# releases younger than min_age_days, which leaves time to notice a bad or
# withdrawn release, and releases of a major version above max_major, which
# can change the CLI. Raise max_major yourself after checking that
# `bws secret get` still works.
bws:
  max_major: 2
  min_age_days: 7

# SSH commit-signing keys, one per machine. Source of truth for both
# ~/.ssh/id_sign_ed25519.pub (this machine's key) and
# ~/.config/git/allowed_signers (every machine trusts all of them).
ssh_sign_pubkeys:
  darwin: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFThAK4bQKmz31+wv5lAK5BF1QLf0CT/qhr30iPtmiGT"
