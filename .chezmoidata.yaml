media_paths:
  linux: "/mnt/storage"

# The restic-termux-backup commit the phone runs
# (run_onchange_after_install-termux-backup.sh). To update the phone: push to
# that repo, put the new commit here, then `chezmoi update` on the phone.
termux_backup:
  commit: "d18aa628e2ae6cef1f4c6a84bf66e5b58d4ddc40"

# Limits for the Android bws updater (run_after_update-bws.sh): it ignores
# releases younger than min_age_days, which leaves time to notice a bad or
# withdrawn release, and releases of a major version above max_major, which
# can change the CLI. Raise max_major yourself after checking that
# `bws secret get` still works.
bws:
  max_major: 2
  min_age_days: 7

# Team Fortress 2 (run_onchange_after_install-tf2). mastercomfig and budhud are pinned
# so that a chezmoi run is reproducible; changing either pin, or the addon list, is
# what makes chezmoi reinstall them.
tf2:
  mastercomfig: "9.100.1"
  preset: low
  # null-canceling-movement is deliberately missing: the NuPhy Air60 HE resolves
  # SOCD (last input priority) in firmware, which the in-game script only duplicates.
  addons:
    - no-pyroland
    - no-soundscapes
    - no-tutorial
    - no-footsteps
    - flat-mouse
    - transparent-viewmodels
  # budhud master at 2026-10-01; the last release tag is 2511_01
  budhud: "a1b348d64ae72d4d2e78e399d5561161ab78ebf7"
  # mat_setvideomode per OS; an OS missing here keeps whatever config.cfg already has
  video_modes:
    darwin: "1280 800 0"
    linux: "1440 900 0"

# SSH commit-signing keys, one per machine. Source of truth for both
# ~/.ssh/id_sign_ed25519.pub (this machine's key) and
# ~/.config/git/allowed_signers (every machine trusts all of them).
ssh_sign_pubkeys:
  darwin: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFThAK4bQKmz31+wv5lAK5BF1QLf0CT/qhr30iPtmiGT"
  android: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF2XufuZr7u5/Yj4/qbkOBr7pbM3kCYQ6rlIKCPST5q3"
  linux: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINm7ctoYtcljx4VxOkyBR6Hd7LTeYcKXeSoCHBurN9Li"

