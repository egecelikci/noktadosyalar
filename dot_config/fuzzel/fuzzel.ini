# fuzzel, the launcher and every picker behind ~/.local/bin/menu (launcher, clipboard, key list).
# ~/.config/fuzzel/fuzzel.ini is a symlink to dot_config/fuzzel/fuzzel.ini in the chezmoi source; fuzzel reads it on every launch, so an edit shows the next time a picker opens.
# `man 5 fuzzel.ini` lists every key.

[main]
# Recursive is the desktop's typeface (fonts in modules/desktop.nix of the nixos repo); the picker rows are sans, the key list asks for the mono itself.
font=Recursive Sans Linear Static:size=13
# A small, quiet prompt glyph instead of the default "> ".
prompt="  "
# Centered and compact: about a third of the 1440 px screen, ten rows.
anchor=center
width=46
lines=10
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=26
# App icons beside launcher rows, from the default icon theme.
icons-enabled=yes
# Colors from Motif (the [colors] section), generated by motif and reached through the ~/.config/motif symlink; fuzzel needs the absolute path.
include=/home/egecelikci/.config/motif/fuzzel/motif-dark.ini
match-mode=fzf

[border]
width=2
radius=12
