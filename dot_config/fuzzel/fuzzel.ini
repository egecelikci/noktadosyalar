# fuzzel, the app launcher on Super+Space (~/.config/sway/config).
# ~/.config/fuzzel/fuzzel.ini is a symlink to dot_config/fuzzel/fuzzel.ini in the chezmoi source; fuzzel reads it on every launch, so an edit shows the next time it opens.
# `man 5 fuzzel.ini` lists every key.

[main]
# Recursive is the desktop's typeface (fonts in modules/desktop.nix of the nixos repo).
font=Recursive Sans Linear Static:size=13
# Two spaces instead of the default "> ": the prompt stays quiet and the row keeps its left inset.
prompt="  "
# Centered and compact: about a third of the 1440 px screen, ten rows.
anchor=center
width=46
lines=10
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=26
# App icons beside launcher rows, from the default icon theme.
icons-enabled=yes
# Colors from Motif (the [colors] section), generated by motif and reached through the ~/.config/motif symlink; fuzzel needs the absolute path.
include=/home/egecelikci/.config/motif/fuzzel/motif-dark.ini
match-mode=fzf

[border]
# Square, like every other Motif edge: sway's window borders have no radius either.
width=2
radius=0
