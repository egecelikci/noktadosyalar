# foot, the terminal. `man 5 foot.ini` lists every key.
# ~/.config/foot/foot.ini is a symlink to dot_config/foot/foot.ini in the chezmoi source (symlink mode); foot reads it when a window opens, so an edit shows in the next new terminal.

[main]
# Colors from Motif: background, text, selection, cursor, URLs and all sixteen ANSI colors, for both schemes ([colors-dark] and [colors-light]), generated by motif and reached through the ~/.config/motif symlink.
# foot needs the absolute path.
include=/home/egecelikci/.config/motif/foot/motif.ini
# The desktop's monospace face (Rec Mono Semicasual, set in the nixos repo's modules/desktop.nix); "monospace" follows that default instead of naming it twice.
font=monospace:size=11
# Some air between the text and the window border.
pad=10x8
# motif.ini fills in both themes; a new window starts in the dark one, because the desktop is dark.
initial-color-theme=dark
