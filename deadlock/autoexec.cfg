// Runs only with `-exec autoexec` in Steam's launch options: LD_PRELOAD="" MANGOHUD_CONFIG="fps_limit=60,fps_limit_method=late" gamemoderun mangohud %command% -dx11 -fullscreen -novid -console -exec autoexec
// Leave capping to MangoHud's late limiter: Source 2's fps_max jitters on a 60 Hz non-VRR panel and early adds a frame of mouse lag, while fps_max_ui still keeps menu power down.
fps_max 0
fps_max_ui 30
